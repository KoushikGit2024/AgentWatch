<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgentWatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Local Vendor Tailwind Engine -->
    <script src="vendor/tailwind.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        zinc: {
                            750: '#202227',
                            850: '#15171c',
                            950: '#0c0d10'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS Overrides -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-zinc-950 text-zinc-100 h-screen w-screen overflow-hidden flex flex-col font-sans select-none antialiased">
    <!-- React Root Mount -->
    <div id="root" class="h-full w-full flex flex-col overflow-hidden"></div>

    <!-- React 18+ UMD Production Engines -->
    <script src="vendor/react.min.js"></script>
    <script src="vendor/react-dom.min.js"></script>

    <!-- Mount React Modular Application -->
    <script type="module">
        import { App } from './js/react/App.js';
        
        const rootElement = document.getElementById('root');
        if (ReactDOM.createRoot) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(React.createElement(App));
        } else {
            ReactDOM.render(React.createElement(App), rootElement);
        }
    </script>
</body>

</html>
